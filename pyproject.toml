[project]
name = "openmixing"
version = "0.1.0"
description = "MCP (stdio) server that lets an agent DJ a folder of tracks: analysis, beatmatching, EQ, loops and tempo-synced fx, rendered to a set"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
  "mcp>=1.2,<2", "numpy", "scipy", "soundfile", "soxr", "pedalboard", "librosa", "pyloudnorm", "mutagen", "requests", "pydantic",
]

[project.optional-dependencies]
beat = ["beat-this"]   # more accurate beat/downbeat tracking (pulls in torch)
fingerprint = ["pyacoustid"]
stems = ["demucs", "torch"]   # stem separation (vocals / drums+bass / harmonic)
dev = ["pytest"]

[project.scripts]
openmixing = "openmixing.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openmixing*"]

[tool.setuptools.package-data]
"openmixing.ui" = ["index.html"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
testpaths = ["tests"]
